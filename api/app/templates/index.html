<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block titulo %}
        Solicitações
        {% endblock %}
    </title>
    <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap"
    rel="stylesheet"/>
        <link rel="stylesheet" href="{{ url_for('static', filename='dist/impper-ui.css') }}"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='dist/impper-bootstrap.css') }}"/>
    <script defer src="{{ url_for('static', filename='dist/impper-ui.js') }}"></script>
</head>
<body class="impper-app">
    
    <div class="imp-shell" data-impper-shell>
    <aside class="imp-sidebar">
    <div class="imp-sidebar__brand">
        <button
        type="button"
        class="imp-sidebar__toggle"
        data-impper-toggle-sidebar
        aria-label="Recolher menu"
        >
        <span class="imp-sidebar__toggle-icon" aria-hidden="true">⇤</span>
        </button>
        <img
        class="imp-logo"
        src="{{ url_for('static', filename='assets/logos/impper-logo-branco.png') }}"
        alt="Grupo Impper"
        >
    </div>

    <nav class="imp-sidebar__nav" aria-label="Navegação principal">
        {% set current_endpoint = request.endpoint or '' %}
        <ul class="imp-nav">
        <li>
            <a class="imp-nav__link{% if current_endpoint == 'index' %} is-active{% endif %}" href="{{ url_for('index') }}">

            <span class="imp-nav__icon" aria-hidden="true">⌂</span>
            <span class="imp-nav__label">Início</span>
            </a>
        </li>

        <li>
            <a class="imp-nav__link" href="#">
            <span class="imp-nav__icon" aria-hidden="true">✉</span>
            <span class="imp-nav__label">Caixa de entrada</span>
            </a>
        </li>

        <li>
            <a class="imp-nav__link{% if current_endpoint == 'solicitacoes' %} is-active{% endif %}" href="{{ url_for('solicitacoes') }}">
            <span class="imp-nav__icon" aria-hidden="true">▤</span>
            <span class="imp-nav__label">Solicitações</span>
            </a>
        </li>

        <li>
            <a class="imp-nav__link{% if current_endpoint == 'novasolicitacao' %} is-active{% endif %}" href="{{ url_for('novasolicitacao') }}">
            <span class="imp-nav__icon" aria-hidden="true">▤</span>
            <span class="imp-nav__label">Nova solicitação</span>
            </a>
        </li>

        <li>
            <a class="imp-nav__link" href="#">
            <span class="imp-nav__icon" aria-hidden="true">▥</span>
            <span class="imp-nav__label">Relatórios</span>
            </a>
        </li>
        </ul>
    </nav>

    </aside>

    <button
    type="button"
    class="imp-sidebar-backdrop"
    data-impper-close-sidebar
    aria-label="Fechar menu"
    ></button>

    <div class="imp-page">
      <header class="imp-topbar">
        <div class="imp-topbar__left">
          <div>
            {% block topBar %}
            {% endblock %}
          </div>
        </div>
      </header>
        <main class="imp-page-content">
            {% block main %}
            {% endblock %}
        </main>
    </div>
    <footer>
    </footer>
</body>
</html>
